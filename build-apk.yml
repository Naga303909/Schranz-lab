name: github/workflows/build-apk.yml
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Installeer afhankelijkheden
        run: npm install --no-audit --no-fund
      - name: Maak Android project
        run: npx cap add android
      - name: Synchroniseer webapp
        run: npx cap sync android
      - name: Bouw debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - name: Downloadbare APK
        uses: actions/upload-artifact@v4
        with:
          name: Schranz-Patch-Lab-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
